<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Momentqr Studio · Dashboard</title>
<link rel="stylesheet" href="admin.css?v=20261127h">
<script src="../app/config.js?v=20261127h"></script>
</head>
<body data-page="dash">
<div class="page">
  <div class="toolbar">
    <h2 style="margin:0;color:#8A2846;font-size:20px;flex:1">Your clients</h2>
    <a class="btn main small" href="client.html" style="text-decoration:none">+ New client</a>
    <button type="button" class="btn sec small" id="reload">Refresh</button>
  </div>
  <div class="msg" id="msg" role="status"></div>
  <div class="cards4" id="list"></div>
</div>
<script src="admin.js?v=20261127h"></script>
<script>
(function(){
  const A = window.MQA, $ = id => document.getElementById(id);
  const EV = { birthday:'Birthday', wedding:'Wedding', aqiqah:'Aqiqah', babyshower:'Baby shower', graduation:'Graduation', custom:'Event' };
  function load(){
    $('list').textContent = ''; A.say('msg', 'Loading...');
    A.api({ op: 'listClients' }).then(r => {
      if (!r.ok) return A.say('msg', r.error || 'Could not load', true);
      A.say('msg', r.items.length ? '' : 'No clients yet. Click "+ New client".');
      r.items.forEach(c => {
        const d = document.createElement('div'); d.className = 'ccard';
        d.innerHTML = '<div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><h3></h3><span class="badge"></span></div>'
          + '<div class="help meta"></div>'
          + '<div class="stats"><div><b class="nP">…</b>photos</div><div><b class="nW">…</b>wishes</div><div><b class="nH">…</b>hidden</div></div>'
          + '<div class="links-row"><a class="e">Edit</a><a class="p">Photos</a><a class="w">Wishes</a><a class="g" target="_blank" rel="noopener">Guest page</a><a class="t" target="_blank" rel="noopener">TV</a><button type="button" class="cp">Copy link</button></div>';
        d.querySelector('h3').textContent = c.NAME || '(no name)';
        const bd = d.querySelector('.badge'); bd.textContent = c.OPEN ? 'Open' : 'Closed'; bd.className = 'badge ' + (c.OPEN ? 'on' : 'off');
        d.querySelector('.meta').textContent = [EV[c.EVENT] || 'Birthday', c.DATE, c.CLOSE_AT ? 'closes ' + c.CLOSE_AT.replace('T', ' ') : '', c.ready ? '' : 'no folder yet'].filter(Boolean).join(' · ');
        d.querySelector('.e').href = 'client.html?code=' + c.code;
        d.querySelector('.p').href = 'photos.html?code=' + c.code;
        d.querySelector('.w').href = 'wishes.html?code=' + c.code;
        d.querySelector('.g').href = A.guestLink(c.code);
        d.querySelector('.t').href = A.tvLink(c.code);
        d.querySelector('.cp').onclick = () => { (navigator.clipboard ? navigator.clipboard.writeText(A.guestLink(c.code)) : Promise.reject()).then(() => A.say('msg', 'Copied: ' + A.guestLink(c.code))).catch(() => A.say('msg', A.guestLink(c.code))); };
        $('list').appendChild(d);
        if (c.ready) A.api({ op: 'stats', code: c.code }).then(s => {
          if (!s.ok) return;
          d.querySelector('.nP').textContent = s.photos - s.hidden; d.querySelector('.nW').textContent = s.wishes; d.querySelector('.nH').textContent = s.hidden;
        });
        else ['.nP','.nW','.nH'].forEach(k => d.querySelector(k).textContent = '0');
      });
    }).catch(() => A.say('msg', 'No connection.', true));
  }
  $('reload').onclick = load;
  A.ready(load);
})();
</script>
</body>
</html>
