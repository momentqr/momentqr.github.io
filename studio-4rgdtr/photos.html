<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Momentqr Studio · Photos</title>
<link rel="stylesheet" href="admin.css?v=20261127h">
<script src="../app/config.js?v=20261127h"></script>
</head>
<body data-page="photos">
<div class="page">
  <div class="toolbar">
    <label for="client" class="help" style="font-weight:700">Client</label>
    <select id="client"></select>
    <button type="button" class="btn sec small" id="reload">Refresh</button>
    <label class="check"><input type="checkbox" id="auto"> Auto-refresh (party mode)</label>
  </div>
  <p class="help" style="margin:-6px 0 12px"><b>Hide</b> removes a photo from the gallery and TV straight away (you can show it again). <b>Delete</b> moves it to the bin.</p>
  <div class="msg" id="msg" role="status"></div>
  <div class="pgrid" id="grid"></div>
</div>
<script src="admin.js?v=20261127h"></script>
<script>
(function(){
  const A = window.MQA, $ = id => document.getElementById(id);
  let code = '', timer = null;
  function load(){
    if (!code) return;
    A.say('msg', 'Loading...');
    A.api({ op: 'photos', code }).then(r => {
      if (!r.ok) return A.say('msg', r.error, true);
      const hid = r.items.filter(p => p.hidden).length;
      A.say('msg', r.items.length + ' photos & videos' + (hid ? ' · ' + hid + ' hidden' : ''));
      const g = $('grid'); g.textContent = '';
      r.items.forEach(p => {
        const d = document.createElement('div'); d.className = 'pcell' + (p.hidden ? ' hid' : '');
        d.innerHTML = '<div class="im"><img alt=""></div><div class="act"><span class="by"></span><span><button type="button" class="btn sec small h"></button> <button type="button" class="btn danger small x">Delete</button></span></div>';
        A.img(d.querySelector('img'), code, p.id, 'small');
        if (p.hidden) d.querySelector('.im').insertAdjacentHTML('beforeend', '<span class="tag">Hidden</span>');
        if (p.video) d.querySelector('.im').insertAdjacentHTML('beforeend', '<span class="tag" style="left:auto;right:6px">Video</span>');
        d.querySelector('.by').textContent = p.by || '';
        const h = d.querySelector('.h'); h.textContent = p.hidden ? 'Show' : 'Hide';
        h.onclick = () => { h.disabled = true; A.api({ op: 'hidePhoto', code, id: p.id, hidden: !p.hidden }).then(x => x.ok ? load() : (A.say('msg', x.error, true), h.disabled = false)); };
        d.querySelector('.x').onclick = () => {
          if (!confirm('Delete this photo? It goes to the Google Drive bin.')) return;
          A.api({ op: 'deletePhoto', code, id: p.id }).then(x => x.ok ? load() : A.say('msg', x.error, true));
        };
        d.querySelector('.im').onclick = () => window.open(A.thumb(p.id, 1600), '_blank', 'noopener');
        g.appendChild(d);
      });
    }).catch(() => A.say('msg', 'No connection.', true));
  }
  $('reload').onclick = load;
  $('auto').onchange = () => { clearInterval(timer); if ($('auto').checked) timer = setInterval(load, 20000); };
  A.ready(() => A.clientPicker('client', c => { code = c; load(); }));
})();
</script>
</body>
</html>
