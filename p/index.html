<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Birthday Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../app/style.css?v=20261127h">
<style>
#boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#FBE7EC;color:#8A2846;font-family:Nunito,system-ui,sans-serif;text-align:center;padding:24px;z-index:9}
#boot .spin{width:42px;height:42px;border-radius:50%;border:4px solid #F4C6D2;border-top-color:#8A2846;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
</style>
<script src="../app/config.js?v=20261127h"></script>
<script src="../app/text.js?v=20261127h"></script>
</head>
<body>
<div id="boot" role="status"><div class="spin" aria-hidden="true"></div><div id="bootMsg">Opening the party page...</div></div>
<script>
(function(){
  const API = window.MOMENTQR_API;
  const code = (new URLSearchParams(location.search).get('c') || location.hash.slice(1) || '').toLowerCase().replace(/[^a-z0-9-]/g, '');
  const fail = t => { document.querySelector('#boot .spin').style.display = 'none'; document.getElementById('bootMsg').textContent = t; };
  if (!API) return fail('This site is not connected yet.');
  if (!code) return fail('Please scan the QR code on your table.');
  const thumb = (id, w) => 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w' + w;
  fetch(API + '?action=client&code=' + encodeURIComponent(code)).then(r => r.json()).then(r => {
    if (!r.ok) return fail(r.error === 'not_found' ? 'Party page not found. Please check the QR code.' : 'Something went wrong. Please try again.');
    const c = r.client;
    window.SETTINGS = {
      NAME: c.NAME, TITLE: c.TITLE, DATE: c.DATE, INVITE_LINE: c.INVITE_LINE, MESSAGE: c.MESSAGE,
      THEME: c.THEME, BG_COLOR: c.BG_COLOR, EVENT: c.EVENT, LANG: c.LANG, HEADLINE: c.HEADLINE,
      BG_IMAGE: c.bgId ? thumb(c.bgId, 1600) : (c.BG_LIBRARY ? '../library/backgrounds/' + c.BG_LIBRARY + '.jpg' : ''),
      PHOTO: c.photoId ? thumb(c.photoId, 600) : '', PHOTO_ID: c.photoId || '',
      SONG: '', OPEN: c.OPEN, CODE: code, UPLOAD_LINK: API
    };
    const sc = document.createElement('script');
    sc.src = '../app/app.js?v=20261127h';
    sc.onload = () => {
      document.getElementById('boot').remove();
      if (c.bgId) { const t = new Image(); t.onerror = () => fetch(API + '?action=img&size=big&id=' + c.bgId + '&code=' + encodeURIComponent(code)).then(r => r.json()).then(r => { if (r.ok) document.getElementById('bgimg').style.backgroundImage = 'url("data:' + r.mime + ';base64,' + r.data + '")'; }).catch(() => {}); t.src = window.SETTINGS.BG_IMAGE; }
      if (c.hasSong) fetch(API + '?action=song&code=' + encodeURIComponent(code)).then(r => r.json()).then(s => {
        if (!s.ok) return;
        const bin = atob(s.data), u8 = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
        window.setSong && window.setSong(URL.createObjectURL(new Blob([u8], { type: s.mime || 'audio/mpeg' })));
      }).catch(() => {});
    };
    document.body.appendChild(sc);
  }).catch(() => fail('Cannot reach the party server right now. Please try again in a minute.'));
})();
</script>
</body>
</html>
