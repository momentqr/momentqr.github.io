<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Slideshow</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../app/style.css">
<script src="../app/config.js"></script>
<script src="../app/qrcode.js"></script>
</head>
<body style="background:#111">
<div id="boot" role="status" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font:600 2vw system-ui,sans-serif">Loading slideshow...</div>
<script>
(function(){
  const API = window.MOMENTQR_API;
  const code = (new URLSearchParams(location.search).get('c') || '').toLowerCase().replace(/[^a-z0-9-]/g, '');
  const fail = t => document.getElementById('boot').textContent = t;
  if (!API || !code) return fail('Missing party code.');
  fetch(API + '?action=client&c=' + encodeURIComponent(code)).then(r => r.json()).then(r => {
    if (!r.ok) return fail('Party not found.');
    const c = r.client;
    window.SETTINGS = { NAME: c.NAME, TITLE: c.TITLE, THEME: c.THEME, BG_COLOR: c.BG_COLOR, CODE: code, UPLOAD_LINK: API,
      GUEST_LINK: new URL('./?c=' + code, location.href).href };
    document.getElementById('boot').remove();
    const sc = document.createElement('script'); sc.src = '../app/tv.js'; document.body.appendChild(sc);
  }).catch(() => fail('No internet connection.'));
})();
</script>
</body>
</html>
